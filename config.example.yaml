telegram:
  # 源群统一模型：监听这些群，全部新消息自动归档。
  # 每个源群可带 default_tags；可选 target_channel_ids 指定多个归档频道（缺省使用全部目标）
  source_chats:
    - chat_id: -100123456789
      name: 游戏
      default_tags:
        - 游戏
      # target_channel_ids: [-100111222333, -100444555666]  # 可选，缺省使用全部目标

    - chat_id: -100987654321
      name: 软件
      default_tags:
        - 软件

    # 中转群作为普通源群之一：历史消息手动转发到这里归档，回复 /tag 可补 tag
    - chat_id: -100444555666
      name: 中转群
      default_tags: []

  # 目标频道列表：源群未指定 target_channel_ids 时，归档到这里的全部频道
  target_channels:
    - chat_id: -100111222333
      name: 测试频道

forward:
  # 默认每隔 N 秒发送一条
  interval: 3
  # 失败最大重试次数，超限标记 failed
  retry_count: 3

source:
  # 归档消息是否显示「来自：」来源链接
  show_link: true

tags:
  # 是否保留原消息中的 hashtag
  preserve_original: true

rating:
  enabled: true

thumbnails:
  # Album 缩略图媒体：first_video=组内第一个视频，first=组内第一条媒体
  media: first_video
  # 缩略图来源：auto=归档优先并回退源消息，archive=仅归档，source=仅源消息
  source: auto

# 归档消息区块顺序；删除 rating/tags/source 可隐藏对应内容，body 必须保留。
# 修改仅影响之后新归档的消息，历史消息保持原样。
message_template: [rating, tags, body, source]

# 定时自动备份数据库：备份文件落在数据库同目录，出现在 Web 后台备份列表，可下载/恢复
backup:
  # 是否启用自动备份
  enabled: true
  # 备份间隔（天），可选 1 / 3 / 7 / 30。程序运行期间每小时巡检一次，到期即备份；
  # 停机期间顺延，下次启动时若已超过间隔会立刻补跑一次
  interval_days: 7
  # 本地保留的最新备份份数，超出自动清理最旧的（不影响已上传到 Telegram 的副本）
  retain: 7
  # 备份后额外上传到的 Telegram 会话 ID（频道/群/收藏夹）；null 表示不上传
  upload_chat_id: null

# 管理员 User ID，验证 event.sender_id 是否在列表中
admins:
  - 123456789

# 数据库文件路径（部署时挂 volume）
database:
  path: archive.sqlite