telegram:
  # 源群统一模型：监听这些群，全部新消息自动归档。
  # 每个源群可带 default_tags；可选 target_channel_ids 指定多个归档频道（缺省使用全部目标）
  source_chats:
    - chat_id: -100123456789
      name: 游戏
      default_tags:
        - 游戏
      # target_channel_ids: [-100111222333, -100444555666]  # 可选，缺省使用全部目标

    - chat_id: -100987654321
      name: 软件
      default_tags:
        - 软件

    # 中转群作为普通源群之一：历史消息手动转发到这里归档，回复 /tag 可补 tag
    - chat_id: -100444555666
      name: 中转群
      default_tags: []

  # 目标频道列表：源群未指定 target_channel_ids 时，归档到这里的全部频道
  target_channels:
    - chat_id: -100111222333
      name: 测试频道

forward:
  # 默认每隔 N 秒发送一条
  interval: 3
  # 失败最大重试次数，超限标记 failed
  retry_count: 3

source:
  # 归档消息是否显示「来自：」来源链接
  show_link: true

tags:
  # 是否保留原消息中的 hashtag
  preserve_original: true

rating:
  enabled: true

thumbnails:
  # Album 缩略图媒体：first_video=组内第一个视频，first=组内第一条媒体
  media: first_video
  # 缩略图来源：auto=归档优先并回退源消息，archive=仅归档，source=仅源消息
  source: auto

# 归档消息区块顺序；删除 rating/tags/source 可隐藏对应内容，body 必须保留。
# 修改仅影响之后新归档的消息，历史消息保持原样。
message_template: [rating, tags, body, source]

search:
  # 私有频道时使用 url_template，{tag} 会被替换成对应 Tag；
  # 公开频道自动生成 https://t.me/channel_name/123
  url_template: "https://t.me/c/123456789?q={tag}"

# 管理员 User ID，验证 event.sender_id 是否在列表中
admins:
  - 123456789

# 数据库文件路径（部署时挂 volume）
database:
  path: archive.sqlite